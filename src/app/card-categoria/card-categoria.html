<div class="card mb-5 shadow-sm">
  <!-- Header categoria -->
  <div class="card-header d-flex justify-content-between align-items-center bg-white border-0" style="background-color: #056939">
    <h4 class="m-0" style="font-weight: bold;">{{ categoryName }}</h4>
    <button class="btn btn-link text-success text-decoration-none" (click)="goToCategoryPage()">
      Vedi tutto
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <!-- Contenuto -->
  <div class="position-relative">

    <!-- Frecce laterali -->
    @if (displayedProducts.length > 0) {
      <button
        class="btn btn-light shadow-sm position-absolute top-50 start-0 translate-middle-y z-2 rounded-circle"
        style="width: 2.5rem; height: 2.5rem;"
        (click)="scrollLeft()">
        <i class="bi bi-chevron-left"></i>
      </button>

      <button
        class="btn btn-light shadow-sm position-absolute top-50 end-0 translate-middle-y z-2 rounded-circle"
        style="width: 2.5rem; height: 2.5rem;"
        (click)="scrollRight()">
        <i class="bi bi-chevron-right"></i>
      </button>
    }

    <!-- Lista prodotti orizzontale -->
    <div
      #scrollContainer
      class="d-flex overflow-hidden gap-3 px-4 py-3 scroll-smooth"
      style="scrollbar-width: thin;">

      @for (p of displayedProducts; track p.productId) {
        <div style="flex: 0 0 auto; width: 250px;">
          <app-card-prodotto [product]="p"></app-card-prodotto>
        </div>
      } @empty {
        <div class="text-center w-100 py-4 text-muted">
          Nessun prodotto disponibile in questa categoria.
        </div>
      }

    </div>
  </div>
</div>
