<button
  class="btn btn-primary w-20 d-flex align-items-center justify-content-center rounded-circle p-2 shadow-sm theme-toggle-btn"
  (click)="toggleTheme()"
  [attr.aria-label]="checked ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
  <i class="bi" [ngClass]="checked ? 'bi-moon-stars-fill' : 'bi-brightness-high-fill'"></i>
</button>
