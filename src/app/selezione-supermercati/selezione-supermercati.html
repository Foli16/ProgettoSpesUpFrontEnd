<app-map></app-map>


<ul class="supermarket-list">
  @for (n of serv.names; track $index) {
    <li class="item">
      <span>{{ n.name }}</span>

      <input type="checkbox"
             [(ngModel)]="n.selected"
             (change)="updateSelectedSupermarkets()" />
    </li>
  }
</ul>

<button (click)="vaiSupermercati()">
  Cerca Prodotti
</button>
