<ul class="list-group">
  @for (n of serv.names; track $index) {
    <li class="list-group-item">
      <input class="form-check-input me-1" type="checkbox" [(ngModel)]="n.selected"
             (change)="updateSelectedSupermarkets()" />
    <label class="form-check-label" for="firstCheckbox">{{ n.name }}</label>
  </li>
  }
</ul>

<div style="display: flex; justify-content: center; margin-top: 20px;">
  <button
    class="btn btn-primary"
    style="background-color: #056939; border-color: #056939; color: white; padding: 5px 5px; border-radius: 20px; cursor: pointer; font-size: 20px; width: 200px;"
    (click)="vaiSupermercati()">
    <b>Conferma</b>
  </button>
</div>
