<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="search-container position-relative">
        <form class="d-flex align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               class="search-icon feather feather-search">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            class="form-control search-input ps-5"
            type="search"
            placeholder="Inserisci un indirizzo"
            [(ngModel)]="address"
            name="address"
            aria-label="Search">
          <button (click)="search()" class="btn btn-search ms-2" type="submit">Cerca</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>


<div class="mappa-container">
  <google-map height="400px" width="100%" [center]="center" [zoom]="zoom">
    <map-marker
      *ngFor="let marker of markers"
      [position]="marker.position"
      [title]="marker.title">
    </map-marker>
  </google-map>
</div>
<div>
  <h2 style="margin-top: 10px"> Seleziona i tuoi supermercati</h2>
</div>

<app-selezione-supermercati></app-selezione-supermercati>
