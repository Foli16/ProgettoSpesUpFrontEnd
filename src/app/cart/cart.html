@if (!cartService.loadingCart) {
<div class="container">
  <table class="table table-striped table-hover">
    <tbody> @for (p of cartService.shoppingList.productList; track $index) { <tr>
      <td>{{p.productName}}</td>
      <td>{{p.category}}</td>
      <td>{{p.supermarketName}}</td>
      <td><button (click)="cartService.removeFromCart(p.priceTrendId)">Rimuovi dal carrello</button>
      </td>
    </tr> }
    </tbody>
  </table>
    <button [routerLink]="'/compare'">CONFRONTA</button>
</div>
} @else {
  <h1>CARICAMENTO...</h1>
}
