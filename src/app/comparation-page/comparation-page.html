<div class="container">
  @for (entry of serv.comparedList | keyvalue; track entry.key)
  {
    <h1>{{entry.key}}</h1>
  <table class="table table-striped table-hover">
    <tbody>
      @for (p of entry.value; track $index)
      {
    <tr>
      <td>{{p.productName}}</td>
      <td>{{p.price}}</td>
<!--      <td><a (click)="serv.removeFromCart(p.priceTrendId)">Rimuovi dal carrello</a>-->
<!--      </td>-->
    </tr>
      }
    </tbody>
  </table>
  }
</div>
