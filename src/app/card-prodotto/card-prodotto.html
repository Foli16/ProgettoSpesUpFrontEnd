<!-- Product Card (singola) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --card-bg: #ffffff;
    --muted: #6c757d;
    --accent: #7FB069; /* verde */
    --accent-dark: #056939;
    --pill-bg: #ffffff;
    --price-old: #904E55;
    --shadow: 0 6px 18px rgba(18, 30, 34, 0.06);
    --radius: 12px;
    --card-width: 260px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  }

  .product-card{
    width: var(--card-width);
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font);
    color: #111;
    position: relative;
  }

  /* media friendly */
  @media (max-width:420px){
    :root { --card-width: 100%; }
    .product-card{ width:100%; }
  }

  /* image area */
  .product-card .media{
    position: relative;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%);
  }

  .product-card img.product-img{
    width: 140px;
    height: 140px;
    object-fit: contain;
    border-radius: 8px;
    background: transparent;
  }

  /* badge (es. 25% off) */
  .badge{
    position: absolute;
    left: 14px;
    top: 14px;
    background: var(--accent);
    color: #fff;
    padding: 6px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(41,128,74,0.12);
  }

  /* favorite heart */
  .favorite{
    position: absolute;
    right: 12px;
    top: 12px;
    width: 36px;
    height: 36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    border: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .favorite svg{ width:18px; height:18px; fill: none; stroke: #cfcfcf; transition: all .18s ease; }
  .favorite.active svg{ stroke: #e94b6b; fill: #e94b6b22; transform: scale(1.06); }

  /* body content */
  .product-body{
    padding: 12px 16px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  /* category small label */
  .category{
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* title */
  .title{
    font-size: 16px;
    font-weight: 600;
    color: #0b1720;
    margin: 0;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* meta row: weight + rating */
  .meta{
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap:8px;
    color: var(--muted);
    font-size: 13px;
  }

  /* rating chip */
  .rating{
    display:flex;
    align-items:center;
    gap:6px;
    background: #fff8e6;
    color: #b67d18;
    padding: 4px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(255,165,0,0.06);
  }

  /* price row */
  .price-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-top:6px;
  }

  /* prices */
  .price{
    display:flex;
    flex-direction: column;
  }
  .current-price{
    font-size: 18px;
    font-weight: 700;
    color: #0b1720;
  }
  .old-price{
    font-size: 13px;
    color: var(--price-old);
    text-decoration: line-through;
    margin-top:2px;
  }

  /* action */
  .actions{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-top: 10px;
  }

  /* add button */
  .btn-add{
    background: linear-gradient(180deg,var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    border: none;
    padding: 9px 12px;
    border-radius: 10px;
    font-weight: 600;
    display:flex;
    align-items:center;
    gap:8px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(38,125,96,0.18);
  }
  .btn-add svg{ width:16px; height:16px; fill: #fff; }

  /* out of stock / small badge */
  .stock{
    font-size: 13px;
    color: #2b7a3a;
    padding: 6px 10px;
    background: var(--pill-bg);
    border-radius: 999px;
    border: 1px solid #eef6ef;
  }

  /* hover effect */
  .product-card:hover{
    transform: translateY(-6px);
    transition: transform .16s ease;
    box-shadow: 0 14px 30px rgba(8,20,30,0.10);
  }
</style>

<article class="product-card" aria-label="Scheda prodotto">
  <div class="media">

    <button class="favorite" aria-pressed="false" title="Aggiungi ai preferiti">
      <!-- heart outline -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.1 20.6s-7.1-4.7-9.2-7.2C-0.6 9.5 3.3 4 8.6 6.4c2.1 1 3.4 3.2 3.4 3.2s1.3-2.2 3.4-3.2c5.3-2.4 9.2 3.1 5.7 7.0-2.1 2.6-9.2 7.4-9.2 7.4z" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- product image: sostituisci src con la tua immagine dinamica -->
    <img class="product-img" [src]="product.imgUrl" [alt]="product.productName">
    </div>

  <div class="product-body">
    <div>
      <div class="category">{{product.category}}</div>
      <h3 class="title">{{product.productName}}</h3>
    </div>

    <div class="meta">
      <div class="weight">{{product.description}}</div>
    </div>

    <div class="price-row">
      <div class="price">
        <span class="current-price">{{product.price}} euro  </span>
        <span class="current-price" style="font-size: 14px">{{product.pricePerType}}</span>
      </div>

      <div class="actions">
        <button class="btn-add" aria-label="Aggiungi al carrello">
          <!-- shopping bag icon -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12H6zM9 7a3 3 0 116 0" /></svg>
          Aggiungi al carrello
        </button>
        <!-- optional small action placeholder -->
        <div style="width:10px;"></div>
      </div>
    </div>
  </div>
</article>
