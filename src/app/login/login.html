<!-- Bottone per aprire il popup - todo aggiungere che la pagina di login si apre quando si preme su cuore (componente preferiti) o
su icona utente (componente omino)-->

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg">
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="modal-header bg-primary text-white position-relative">
          <h5 class="modal-title w-100 text-center" id="loginModalLabel">Accedi al tuo account</h5>
          <button type="button" class="btn-close btn-close-white position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="email" class="form-label"><b>Email</b></label>
            <input type="text" id="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="Inserisci la tua email">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label"><b>Password</b></label>
            <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required placeholder="Inserisci la tua password">
          </div>
        </div>
        <div class="modal-footer d-flex flex-column">
          <div class="text-center">
            <button type="submit" class="btn btn-primary w-20" [disabled]="email == '' || password == ''" data-bs-dismiss="modal">Accedi</button>
          </div>
          <div class="mt-3 text-center">
            <small>Non sei registrato? <a routerLink="/register" class="text-decoration-none" data-bs-dismiss="modal">Registrati</a></small>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
