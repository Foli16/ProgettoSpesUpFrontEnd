<div class="container">
  <button (click)="tornaSupermercati()">INDIETRO</button>
  <table class="table table-striped table-hover">

    <tbody>
      @for (p of serv.getFilteredByName(""); track $index) {
        <tr>
          <td>{{p.productName}}</td>
          <td>{{p.category}}</td>
          <td>{{p.supermarketName}}</td>
          <td><button (click)="cServ.addToCart(p.priceTrendId)">Aggiungi al carrello</button></td>
        </tr>
      }
    </tbody>
  </table>
</div>
